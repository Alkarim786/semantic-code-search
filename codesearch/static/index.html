<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic Code Search</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --border:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; } .muted { color: var(--muted); font-size: 13px; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  input, select, button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font:inherit; }
  input[name=q] { flex: 1 1 320px; } button { background:#238636; border-color:#2ea043; cursor:pointer; }
  .hit { background:var(--panel); border:1px solid var(--border); border-radius:8px; margin:12px 0; overflow:hidden; }
  .hit header { padding:8px 12px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .hit a { color:var(--accent); text-decoration:none; } .badge { font-size:12px; color:var(--muted); }
  pre { margin:0; max-height: 320px; overflow:auto; } code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>🔎 Semantic Code Search</h1>
  <div class="muted" id="stats">loading index…</div>
  <form id="f">
    <input name="q" placeholder="e.g. retry a request with exponential backoff" required minlength="2" autofocus>
    <select name="mode"><option value="hybrid">hybrid</option><option value="dense">semantic</option><option value="bm25">keyword</option></select>
    <select name="language"><option value="">any language</option><option>python</option><option>javascript</option><option>typescript</option><option>go</option><option>java</option><option>rust</option></select>
    <button>Search</button>
  </form>
  <div class="muted" id="meta"></div>
  <div id="results"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
fetch("/api/stats").then(r => r.json()).then(s => {
  $("#stats").textContent = `${s.chunks.toLocaleString()} chunks from ${Object.keys(s.repos).length} repos · ${s.embedder}`;
});
$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = new URLSearchParams(new FormData(e.target));
  if (!p.get("language")) p.delete("language");
  const r = await fetch(`/api/search?${p}`);
  const d = await r.json();
  if (!r.ok) { $("#meta").textContent = d.detail ?? "error"; return; }
  $("#meta").textContent = `${d.results.length} results in ${d.took_ms} ms`;
  const box = $("#results");
  box.replaceChildren();
  for (const h of d.results) {
    const div = document.createElement("div"); div.className = "hit";
    const head = document.createElement("header");
    const a = document.createElement(h.url ? "a" : "span");
    if (h.url) { a.href = h.url; a.target = "_blank"; a.rel = "noopener"; }
    a.textContent = `${h.repo} · ${h.path}:${h.start_line}`;
    const b = document.createElement("span"); b.className = "badge";
    b.textContent = `${h.kind} ${h.name} · bm25 #${h.bm25_rank ?? "–"} · semantic #${h.dense_rank ?? "–"}`;
    head.append(a, b);
    const pre = document.createElement("pre"); const code = document.createElement("code");
    code.className = `language-${h.language}`; code.textContent = h.code; pre.append(code);
    div.append(head, pre); box.append(div);
    hljs.highlightElement(code);
  }
});
</script>
</body>
</html>
