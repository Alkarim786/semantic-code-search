[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codesearch"
version = "0.1.0"
description = "Semantic code search: tree-sitter chunking, code embeddings, FAISS HNSW, hybrid ranking, web UI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Karim (Alkarim786)" }]
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.6",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["codesearch*"]

[tool.setuptools.package-data]
codesearch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM905"]
